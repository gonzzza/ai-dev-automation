name: Implement a spec
# Names each run after its spec, so the run list shows which spec a run is working on (spec 005).
run-name: Implement ${{ inputs.spec }}${{ inputs.dry-run && ' (dry run)' || '' }}

# Run by hand from the Actions tab: the agent implements one spec from specs/ and opens a PR as the
# agent's GitHub App. The AI review and the fix cycle (ai-review.yml) take it from there, and a
# person approves the merge. Locally, `npm run agent -- specs/<spec>.md` does the same under your
# own identity.
on:
  workflow_dispatch:
    inputs:
      spec:
        description: "The spec to implement, e.g. specs/001-rate-limiter.md"
        required: true
        type: string
      dry-run:
        description: "Implement and verify, but don't commit, push or open a PR"
        type: boolean
        default: false

# GITHUB_TOKEN only reads. The branch, the push and the PR use the agent App's token.
permissions:
  contents: read

concurrency:
  group: implement-spec-${{ inputs.spec }}
  cancel-in-progress: false

env:
  AGENT_MODEL: claude-opus-5-5 # keep in step with AGENT_MODEL in ai-review.yml

jobs:
  implement:
    # Specs are implemented from main, so the PR contains only the agent's work.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check the spec path
        env:
          SPEC: ${{ inputs.spec }}
        run: |
          if [[ ! "$SPEC" =~ ^specs/[A-Za-z0-9._-]+\.md$ ]] || [ "$SPEC" = "specs/README.md" ]; then
            echo "::error::spec must be a spec file in specs/, like specs/001-rate-limiter.md (got '$SPEC')."
            exit 1
          fi
      # Inline rather than in a local action: the workflow files are what the agent's App can't
      # change (it has no Workflows permission), so nothing the agent can edit ever handles the
      # private key. The token lasts an hour and covers this repository only, with Contents and
      # Pull requests write and nothing else.
      - name: Mint the agent App's token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep tokens out of .git/config: agent-written tests run in this job.
          persist-credentials: false
      - name: Check the spec exists
        env:
          SPEC: ${{ inputs.spec }}
        run: |
          if [ ! -f "$SPEC" ]; then
            echo "::error::$SPEC doesn't exist on main."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Agent-written tests run in this image with no network, no secrets and a read-only .git.
      - name: Pull the checks sandbox image
        run: docker pull node:24-bookworm
      - name: Implement the spec
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          AGENT_APP: ${{ steps.app.outputs.app-slug }}
          SPEC: ${{ inputs.spec }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          options=()
          if [ "$DRY_RUN" = "true" ]; then options+=(--dry-run); fi
          # Commit as the App's bot, with its noreply address so GitHub links the commits to it.
          login="${AGENT_APP}[bot]"
          id=$(gh api "users/${login}" --jq .id) # on its own line, so a failed lookup fails the step
          git config user.name "$login"
          git config user.email "${id}+${login}@users.noreply.github.com"
          gh auth setup-git # the harness pushes through gh's credential helper, which reads GH_TOKEN
          # The org standards at this commit of main, which the review of the PR will also use.
          # Exit code 3 means another run (local or CI) already claimed the spec: not a failure (spec 006).
          code=0
          npm run agent -- "$SPEC" --model "$AGENT_MODEL" --log-dir "$RUNNER_TEMP/agent-logs" \
            --sandbox docker --standards org-standards --standards-ref "$GITHUB_SHA" "${options[@]}" || code=$?
          if [ "$code" -eq 3 ]; then
            echo "::notice::Another run already claimed $SPEC; nothing to do."
            exit 0
          fi
          exit "$code"
      # The audit log: the transcript, every policy decision, and the outcome, redacted. Uploaded
      # even when the run fails, which is when it matters most.
      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-logs/
          if-no-files-found: warn # no log means the run failed before it started, or logging broke
          retention-days: 30
