name: AI review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

# Different models write and review the code, so the review doesn't share the author's blind spots.
# See "Why two models" in the README.
env:
  AGENT_MODEL: claude-opus-5-5
  REVIEW_MODEL: claude-sonnet-5-5

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Per job, not per workflow: a new push cancels a review in progress, but never a fix job mid-push.
    concurrency:
      group: ai-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    outputs:
      highest-severity: ${{ steps.review.outputs.highest-severity }}
      findings-json: ${{ steps.review.outputs.findings-json }}
    steps:
      # Runs the action from this checkout, so every PR exercises the current code.
      # Other repos use: gonzzza/ai-dev-automation/review-action@v1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The org standards, from the PR's base commit: a PR can't change the rules it is reviewed
      # against. Other repos would check out their platform repo here at a pinned tag instead.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .org-standards
          sparse-checkout: org-standards
          persist-credentials: false
      # Empty until the base has standards (e.g. the PR that adds them), which turns the feature off.
      - id: standards
        run: |
          if [ -d .org-standards/org-standards ]; then
            echo "path=.org-standards/org-standards" >> "$GITHUB_OUTPUT"
          fi
      - id: review
        uses: ./review-action
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: ${{ env.REVIEW_MODEL }}
          fail-on: none
          standards-path: ${{ steps.standards.outputs.path }}
          standards-ref: ${{ github.event.pull_request.base.sha }}

  # Fix cycle: on the agent's own PRs, the agent addresses findings at medium or above, pushes, and
  # the push triggers this workflow again. The agent stops itself after 5 fix commits or when the
  # review raises a finding it already worked on (see agent/README.md#fix-cycle). Low findings go to the human.
  fix:
    needs: review
    if: >-
      startsWith(github.head_ref, 'agent/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["medium", "high", "critical"]'), needs.review.outputs.highest-severity) &&
      github.event.pull_request.user.type == 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: agent-fix-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    # GITHUB_TOKEN only reads. The push, the PR comment and the thread replies use the agent App's
    # token: they show as the App's bot, and unlike GITHUB_TOKEN, its push triggers the next review.
    permissions:
      contents: read
    steps:
      # Minted first, before any code from the PR branch is checked out, and inline rather than in a
      # local action: the workflow files are what the agent's App can't change (it has no Workflows
      # permission), so nothing a branch can edit ever handles the private key. The token lasts an
      # hour and covers this repository only, with Contents and Pull requests write and nothing else.
      - name: Mint the agent App's token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # Anyone with push access can name a branch agent/*, but only the App can open a PR as its bot.
      # The harness checks this again (--agent-app); this fails fast, before the checkout and install.
      - name: Check the agent's App opened this PR
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          AGENT: ${{ steps.app.outputs.app-slug }}[bot]
        run: |
          if [ "$AUTHOR" != "$AGENT" ]; then
            echo "::error::This PR was opened by $AUTHOR, not $AGENT. The fix cycle only runs on the agent's own PRs."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0 # the fix cycle counts its earlier commits on the branch
          # Keep tokens out of .git/config: agent-written tests run in this job.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Agent-written tests run in this image with no network, no secrets and a read-only .git.
      # Pulled up front so the agent's first check isn't slowed by the download.
      - name: Pull the checks sandbox image
        run: docker pull node:24-bookworm
      # The org standards from the PR's base commit, as the review job reads them, so the fixer
      # follows the rules the review checks. Extracted outside the repo: the harness rejects
      # untracked files in the checkout. Empty when the base has none, which turns them off.
      - name: Extract org standards from the base commit
        id: standards
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # A missing commit is a broken checkout, not "no standards": fetch it, and fail if that fails.
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" ||
              { echo "::error::Base commit $BASE_SHA is not available, so the fixer can't get the org standards."; exit 1; }
          fi
          if git cat-file -e "$BASE_SHA:org-standards" 2>/dev/null; then
            mkdir -p "$RUNNER_TEMP/standards"
            git archive "$BASE_SHA" org-standards | tar -x -C "$RUNNER_TEMP/standards"
            echo "path=$RUNNER_TEMP/standards/org-standards" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The base commit has no org-standards/; the fix cycle runs without standards."
          fi
      - name: Fix cycle
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          AGENT_APP: ${{ steps.app.outputs.app-slug }}
          # Model output: passed through the environment, never interpolated into the script.
          FINDINGS: ${{ needs.review.outputs.findings-json }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
          STANDARDS_PATH: ${{ steps.standards.outputs.path }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          standards=()
          if [ -n "$STANDARDS_PATH" ]; then
            standards=(--standards "$STANDARDS_PATH" --standards-ref "$BASE_SHA")
          fi
          if [ "$AGENT_MODEL" = "$REVIEW_MODEL" ]; then
            echo "::warning::The agent and the reviewer both use $AGENT_MODEL. The review is less independent; see 'Why two models' in the README."
          fi
          # Commit as the App's bot, with its noreply address so GitHub links the commits to it.
          login="${AGENT_APP}[bot]"
          id=$(gh api "users/${login}" --jq .id) # on its own line, so a failed lookup fails the step
          git config user.name "$login"
          git config user.email "${id}+${login}@users.noreply.github.com"
          gh auth setup-git # the harness pushes through gh's credential helper, which reads GH_TOKEN
          printf '%s' "$FINDINGS" > "$RUNNER_TEMP/findings.json"
          npm run agent -- --fix-pr "$PR_NUMBER" --findings "$RUNNER_TEMP/findings.json" \
            --reviewed-sha "$REVIEWED_SHA" --agent-app "$AGENT_APP" --model "$AGENT_MODEL" \
            --max-cycles 5 --max-budget 3 --log-dir "$RUNNER_TEMP/agent-logs" --sandbox docker "${standards[@]}"
      # The audit log: the transcript, every policy decision, and the outcome, redacted. Uploaded
      # even when the run fails, which is when it matters most. The PR comment links to this run.
      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-logs/
          if-no-files-found: warn # no log means the run failed before it started, or logging broke
          retention-days: 30
