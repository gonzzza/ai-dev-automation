name: AI review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

# Different models write and review the code, so the review doesn't share the author's blind spots.
# See "Why two models" in the README.
env:
  AGENT_MODEL: claude-opus-5-5
  REVIEW_MODEL: claude-sonnet-5-5

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Per job, not per workflow: a new push cancels a review in progress, but never a fix job mid-push.
    concurrency:
      group: ai-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    outputs:
      highest-severity: ${{ steps.review.outputs.highest-severity }}
      findings-json: ${{ steps.review.outputs.findings-json }}
    steps:
      # Runs the action from this checkout, so every PR exercises the current code.
      # Other repos use: gonzzza/ai-dev-automation/review-action@v1
      - uses: actions/checkout@v7
      # The org standards, from the PR's base commit: a PR can't change the rules it is reviewed
      # against. Other repos would check out their platform repo here at a pinned tag instead.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .org-standards
          sparse-checkout: org-standards
          persist-credentials: false
      # Empty until the base has standards (e.g. the PR that adds them), which turns the feature off.
      - id: standards
        run: |
          if [ -d .org-standards/org-standards ]; then
            echo "path=.org-standards/org-standards" >> "$GITHUB_OUTPUT"
          fi
      - id: review
        uses: ./review-action
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: ${{ env.REVIEW_MODEL }}
          fail-on: none
          standards-path: ${{ steps.standards.outputs.path }}
          standards-ref: ${{ github.event.pull_request.base.sha }}

  # Fix cycle: on the agent's own PRs, the agent addresses findings at medium or above, pushes, and
  # the push triggers this workflow again. The agent stops itself after 5 fix commits or when the
  # review raises a finding it already worked on (see agent/README.md#fix-cycle). Low findings go to the human.
  fix:
    needs: review
    if: >-
      startsWith(github.head_ref, 'agent/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["medium", "high", "critical"]'), needs.review.outputs.highest-severity)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: agent-fix-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    # GITHUB_TOKEN only reads. The push and the PR comment use AGENT_GITHUB_TOKEN, because a push made
    # with GITHUB_TOKEN does not trigger workflows, so the fix would never be reviewed.
    permissions:
      contents: read
    steps:
      - name: Require AGENT_GITHUB_TOKEN
        env:
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        run: |
          if [ -z "$AGENT_GITHUB_TOKEN" ]; then
            echo "::error::Set the AGENT_GITHUB_TOKEN secret to run the fix cycle (see agent/README.md#fix-cycle)."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0 # the fix cycle counts its earlier commits on the branch
          # Keep tokens out of .git/config: agent-written tests run in this job.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Agent-written tests run in this image with no network, no secrets and a read-only .git.
      # Pulled up front so the agent's first check isn't slowed by the download.
      - name: Pull the checks sandbox image
        run: docker pull node:24-bookworm
      - name: Fix cycle
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          # Model output: passed through the environment, never interpolated into the script.
          FINDINGS: ${{ needs.review.outputs.findings-json }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$AGENT_MODEL" = "$REVIEW_MODEL" ]; then
            echo "::warning::The agent and the reviewer both use $AGENT_MODEL. The review is less independent; see 'Why two models' in the README."
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git # the harness pushes through gh's credential helper, which reads GH_TOKEN
          printf '%s' "$FINDINGS" > "$RUNNER_TEMP/findings.json"
          npm run agent -- --fix-pr "$PR_NUMBER" --findings "$RUNNER_TEMP/findings.json" \
            --reviewed-sha "$REVIEWED_SHA" --model "$AGENT_MODEL" --max-cycles 5 --max-budget 3 \
            --log-dir "$RUNNER_TEMP/agent-logs" --sandbox docker
      # The audit log: the transcript, every policy decision, and the outcome, redacted. Uploaded
      # even when the run fails, which is when it matters most. The PR comment links to this run.
      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-logs/
          if-no-files-found: warn # no log means the run failed before it started, or logging broke
          retention-days: 30
