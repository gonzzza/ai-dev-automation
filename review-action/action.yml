name: "AI Code Review (Claude)"
description: "Reviews a pull request diff with Claude and posts inline comments on bugs, security issues and missing tests."
author: "Gonzalo Villar"
branding:
  icon: "eye"
  color: "orange"

inputs:
  anthropic-api-key:
    description: "Anthropic API key. Pass it from a secret. If empty (e.g. PRs from forks), the review is skipped with a warning."
    required: true
  github-token:
    description: "Token used to read the PR and post the review. Needs `pull-requests: write`."
    default: ${{ github.token }}
  model:
    description: "Claude model ID."
    default: "claude-sonnet-5-5"
  effort:
    description: "Reasoning effort: low, medium, high, xhigh or max."
    default: "high"
  fail-on:
    description: "Fail the check when a finding is at or above this severity: none, low, medium, high or critical."
    default: "none"
  max-diff-chars:
    description: "Budget for the diff sent to the model, in characters. Files beyond it are listed as not reviewed."
    default: "400000"
  exclude:
    description: "Extra glob patterns to skip, one per line. Lockfiles, dist/, *.map, *.snap and *.min.js are always skipped."
    default: ""
  standards-path:
    description: "Directory of org engineering standards to review against (one subdirectory per pack). Check it out from a pinned ref or the PR base, never the PR head. Empty turns the feature off."
    default: ""
  standards-packs:
    description: "Packs to load, comma- or newline-separated. Empty loads all of them."
    default: ""
  standards-ref:
    description: "Label for the version of the standards being applied (a tag or SHA), shown in the review summary."
    default: ""
  max-standards-chars:
    description: "Budget for standards text in the prompt, in characters. Past it, the least severe standards are left out and listed as not checked."
    default: "40000"

outputs:
  findings:
    description: "Number of findings."
  highest-severity:
    description: "Highest severity found, or `none`."
  findings-json:
    description: "The findings as a JSON array (path, line, category, severity, title, body, rule for findings that break an org standard, and commentId for findings posted as inline comments), most severe first, capped at 64 KB so it fits in an env var: long bodies are truncated and the least severe findings dropped first. Model output: validate before acting on it."

runs:
  using: "node24"
  main: "dist/index.js"
